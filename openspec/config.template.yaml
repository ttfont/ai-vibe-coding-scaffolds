schema: spec-driven

context: |
  template_variables:
    - "{{PROJECT_NAME}}"
    - "{{PROJECT_TYPE}}"
    - "{{PACKAGE_BASE}}"
    - "{{PRIMARY_LANGUAGE}}"
    - "{{RUNTIME_VERSION}}"
    - "{{BACKEND_STACK}}"
    - "{{FRONTEND_STACK}}"
    - "{{MODULE_LIST}}"
    - "{{VALIDATION_COMMANDS}}"

  quick_start:
    language: 中文（简体）
    rules:
      - 所有产出物必须使用简体中文
      - 先契约后实现
      - 优先最小改动
      - 不扩大需求范围

  current_project:
    "{{PROJECT_NAME}}": "{{PROJECT_NAME_VALUE}}"
    "{{PROJECT_TYPE}}": "{{PROJECT_TYPE_VALUE}}"
    "{{PACKAGE_BASE}}": "{{PACKAGE_BASE_VALUE}}"
    "{{PRIMARY_LANGUAGE}}": "{{PRIMARY_LANGUAGE_VALUE}}"
    "{{RUNTIME_VERSION}}": "{{RUNTIME_VERSION_VALUE}}"
    "{{BACKEND_STACK}}": "{{BACKEND_STACK_VALUE}}"
    "{{FRONTEND_STACK}}": "{{FRONTEND_STACK_VALUE}}"
    "{{MODULE_LIST}}": "{{MODULE_LIST_VALUE}}"

  progressive_disclosure:
    read_more_when:
      - 需要 proposal / design / tasks
      - 涉及行为变化、breaking change、鉴权、安全、缓存、前后端联动
      - 需要判断规则优先级、兼容性或回滚方式

  core_rules:
    architecture:
      - 优先复用现有模块边界、目录结构、命名方式和基础设施
      - 新业务优先放业务模块，不写进基础框架模块
      - 涉及跨层行为变化时，先更新契约再做代码实现
    backend:
      - 保持项目既有分层结构
      - Controller 只负责接参、校验、权限、调用 Service、返回统一响应
      - Service 承载事务、业务规则、编排和转换
      - 复杂 SQL 放到项目既有 Mapper XML 或查询层
      - 列表接口默认分页，避免随意提供全量查询
    security:
      - 普通业务接口默认需要认证
      - 公开接口必须进入既有白名单机制
      - 不得破坏现有登录、白名单、权限校验、Token 续期和缓存逻辑
    logging:
      - 不吞异常，catch 后保留完整堆栈
      - 不记录密码、Token、密钥、手机号完整值等敏感信息
      - 联调失败信息应保留足够上下文，避免只写“调用失败”
    frontend:
      - 仓库存在前端目录时才应用前端规则
      - 默认按 `{{FRONTEND_STACK_BASELINE}}` 理解，若项目实际不同，以真实依赖和构建配置为准
      - 页面、组件、状态、路由、API 封装按业务域组织
      - 优先复用共享组件、样式变量、hooks、请求封装和布局容器
      - UI 改动默认不改变业务逻辑和文案语义，除非需求明确要求
      - 新增接口路径时同步检查代理、网关、环境变量和构建配置
      - 不在前端持久化敏感明文

  special_scope:
    framework_exceptions:
      applies_to:
        - JWT / Spring Security
        - Token 生成、校验、刷新、缓存
        - 登录过滤器与权限拦截器
        - 数据权限
        - 全局异常
        - Redis 封装
        - Jackson / CORS / XSS 等通用配置
      rules:
        - 不要求套用普通业务 CRUD 模板
        - 必须先分析现有链路，再给出最小改动方案
        - 必须说明影响范围、兼容策略与回滚方式

  openspec_workflow:
    propose:
      - 先分析现有结构、接口、表结构、权限点和代码风格
      - 先给方案，再沉淀 proposal / design / tasks
    apply:
      - 严格按已确认变更实施
      - 优先复用现有基础设施、公共组件与共享工具
      - 不扩大需求边界，不重构无关代码
    explore:
      - 只做阅读、分析、定位和建议
      - 不在未确认前直接写业务代码
    archive:
      - 只沉淀稳定、长期可复用的规则
      - 一次性业务要求不要写成全局规范

  living_updates:
    guidance:
      - 稳定工作规则追加到 AGENTS.md
      - 稳定项目背景追加到 project.md
      - 高密度 AI 生成约束追加到 openspec/config.yaml
      - 单次需求细节写到 openspec/changes/<change-id>/

  delivery:
    must_do:
      - 说明影响范围
      - 说明验证方式与结果
      - 涉及行为变化时说明兼容性
    validation:
      backend_default: "{{BACKEND_VALIDATION_COMMAND}}"
      frontend_default: "{{FRONTEND_VALIDATION_COMMAND}}"
      openspec_default: "{{OPENSPEC_VALIDATION_COMMAND}}"
